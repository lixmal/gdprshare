# post size in MiB
maxuploadsize: 25

idlength: 20

# directory to store uploaded files
storepath: 'files'

# listen address/port
listenaddr: ':8080'

tls:
    use:  false
    key:  '/etc/ssl/private/ssl-cert-snakeoil.key'
    cert: '/etc/ssl/certs/ssl-cert-snakeoil.pem'

database:
    # see https://godoc.org/github.com/jinzhu/gorm#Open
    driver: 'sqlite3'
    args:   'gdprshare.db'

mail:
    smtphost: 'localhost'
    smtpport: 25
    smtpuser: ''
    smtppass: ''
    from:     'root@localhost'
    subject:  'File has been accessed: %s'
    subjectreceipt: 'File download confirmed: %s'

    # available variables:
    #   .FileID
    #   .Addr
    #   .UserAgent
    #   .SrcTLSVersion
    #   .SrcTLSCipherSuite
    #   .DstTLSVersion
    #   .DstTLSCipherSuite
    #   .Location.Continent
    #   .Location.Country
    #   .Location.Subdivision1
    #   .Location.Subdivision2
    #   .Location.City
    #   .Location.IsEU
    #   .DeniedMsg
    #
    # Example:
    #
    # body: |
    #     File ID: {{.FileID}}
    #     IP Address: {{.Addr}}
    #     User Agent: {{.UserAgent}}
    #     Encryption Sender: {{.SrcTLSVersion}}/{{.SrcTLSCipherSuite}}
    #     Encryption Receiver: {{.DstTLSVersion}}/{{.DstTLSCipherSuite}}

    #     {{if .Location -}}
    #     Continent: {{.Location.Continent}}
    #     Country: {{.Location.Country}}
    #     {{- if .Location.Subdivision1 }}
    #     Subdivision1: {{.Location.Subdivision1}}
    #     {{- end }}
    #     {{- if .Location.Subdivision2 }}
    #     Subdivision2: {{.Location.Subdivision2}}
    #     {{- end }}
    #     City: {{.Location.City}}
    #     {{- end }}

    #     {{.DeniedMsg}}

    body: "File download with id {{.FileID}} has been attempted. {{.DeniedMsg}}"
    deniedmsg: 'Download was denied.'


# headers in case app is behind a reverse proxy
header:
    tlsversion:     'X-TLS-Version'
    tlsciphersuite: 'X-TLS-CipherSuite'

# who may set X-Forwarded-For and the tls headers above.
#
# 'all' believes any client. That is what this server has always done and is
# what you get by leaving this out, but it is only safe where nothing except the
# proxy can reach the app: a client that sets X-Forwarded-For itself otherwise
# picks its own rate limit bucket, its own country for the download
# restrictions, and its own tls evidence in the download records.
#
# 'none' believes nobody and reads the address the connection came from, which
# is right when there is no proxy in front.
#
# Otherwise list the addresses or CIDR prefixes of the proxies themselves,
# e.g. ['127.0.0.1', '::1'] for one on the same host.
trustedproxies: ['all']

# saves receiver IP addr and user agent in database
saveclientinfo: false

# deletes expired files from inside the server, so no cron job is needed.
# the -cleanup flag stays available for setups that drive it from outside.
cleanup:
    enabled:  true
    interval: '1h'

# linked in the page footer, left out when empty
privacyurl: ''
imprinturl: ''

# show the closing countdown on ephemeral images during download
showcountdown: false

# MaxMind GeoLite2 City database path (mmdb file)
geoippath: ''

# who may use this server, established against an OpenID Connect provider.
# 'uploads' asks the sender to sign in and leaves a share's recipient alone,
# since they are the person a link was sent to rather than a user of this
# server. 'all' asks everyone. Sessions live in the database, so they survive a
# restart, end the moment they are signed out, and are swept with everything
# else. The provider needs the redirect url registered as it stands here.
oidc:
    enabled:  false
    issuer:   'https://auth.example.org/realms/main'
    clientid: 'gdprshare'
    clientsecret: ''
    redirecturl:  'https://share.example.org/auth/callback'
    scopes:  ['openid', 'email', 'profile']
    protect: 'uploads'
    # when set, a visitor has to be in one of them
    allowedgroups: []
    groupsclaim:   'groups'
    sessionlifetime: '12h'

# rate limiting per IP address
ratelimit:
    enabled: true
    rps:     10    # requests per second per IP
    burst:   20    # maximum burst size

# TLS version and cipher validation
tlsvalidation:
    enabled:    false  # set to true in production with TLS/reverse proxy
    minversion: '1.2'  # minimum TLS version (1.0, 1.1, 1.2, 1.3)
    # refuse a request that says nothing about its encryption, instead of
    # letting it through unchecked. off by default, since a server that neither
    # terminates TLS itself nor sits behind a trusted proxy setting the headers
    # would then refuse everything. turn it on once one of those is true.
    required:   false
    # optional: additional ciphers to block (hex format)
    # blockedciphers:
    #   - '0x000a'

# what the server states about how its pages may be used. left out, all of it
# is sent: the app is only as safe as the guarantee that the script doing the
# encrypting is the one that was shipped, and the policy is what says so.
securityheaders:
    enabled: true
    # turn this off if the proxy in front sends its own content security
    # policy: a browser applies both, and only what passes each of them runs.
    csp:     true
    # sent where this server terminates TLS itself. a proxy that terminates it
    # should send this header, or turn this on here.
    # hsts:       true
    # hstsmaxage: 31536000

# for config via env vars see https://github.com/jinzhu/configor#advanced-usage
